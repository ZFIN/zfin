# Repository hygiene: runs the checks in .pre-commit-config.yaml on the files a pull request or push changes.

name: Hygiene

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'
    - uses: actions/cache@v6
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
    - name: Install pre-commit
      run: pip install pre-commit==4.7.0
    - name: Run checks on the changed files
      env:
        FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
        TO: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        # a push that rewrote history (or created the branch) has no usable "before": check the last commit only
        git cat-file -e "$FROM^{commit}" 2>/dev/null || FROM=$TO~1
        pre-commit run --show-diff-on-failure --color=always --from-ref "$FROM" --to-ref "$TO"
